name: Lotto 539 Auto Update

on:
  schedule:
    - cron: '35 12 * * 1-6'
    - cron: '0 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '0 14 * * 1-6'
  
  workflow_dispatch:

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node update.js
